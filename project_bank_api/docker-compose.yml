services:
  # ==========================================
  # SERVICES
  # ==========================================
  account-service:
    container_name: service_account_service
    build:
      context: .
      dockerfile: account-service/Dockerfile
    ports:
      - "8081:8081"
      - "50051:50051"
    environment:
      - DB_HOST=account-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=account_db
      - DB_SSLMODE=disable
      - SERVER_PORT=8081
      - GRPC_PORT=50051
      - SNAP_SECRET_KEY=my-snap-secret-key-for-signature
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OTEL_COLLECTOR_HOST=otel-collector
      - KAFKA_BROKER=kafka:29092
    depends_on:
      account-db:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  transaction-service:
    container_name: service_transaction_service
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=transaction-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=transaction_db
      - DB_SSLMODE=disable
      - SERVER_PORT=8082
      - ACCOUNT_GRPC_ADDR=account-service:50051
      - SNAP_SECRET_KEY=my-snap-secret-key-for-signature
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OTEL_COLLECTOR_HOST=otel-collector
      - KAFKA_BROKER=kafka:29092
    depends_on:
      transaction-db:
        condition: service_healthy
      account-service:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  notification-service:
    container_name: service_notification_service
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=notification-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=notification_db
      - DB_SSLMODE=disable
      - SERVER_PORT=8083
      - PARTNER_CALLBACK_URL=https://webhook.site/0f63ac8d-4b0f-4ff2-87f3-7094b4c1cc31
      - OTEL_COLLECTOR_HOST=otel-collector
      - KAFKA_BROKER=kafka:29092
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # ==========================================
  # DATABASES
  # ==========================================
  account-db:
    container_name: db_account_db
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=account_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d account_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - account_pgdata:/var/lib/postgresql/data

  transaction-db:
    container_name: db_transaction_db
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=transaction_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transaction_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - transaction_pgdata:/var/lib/postgresql/data

  notification-db:
    container_name: db_notification_db
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=notification_db
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - notification_pgdata:/var/lib/postgresql/data

  redis:
    container_name: db_redis
    image: redis:7-alpine
    ports:
      - "6381:6379"

  # ==========================================
  # OTHERS
  # ==========================================
  kafka:
    container_name: infra_kafka
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    container_name: infra_kafka_ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: snap-bank
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  otel-collector:
    container_name: obs_otel_collector
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    depends_on:
      - tempo
      - loki

  loki:
    container_name: obs_loki
    image: grafana/loki:latest
    ports:
      - "3101:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    container_name: obs_promtail
    image: grafana/promtail:latest
    volumes:
      - ./promtail.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  tempo:
    container_name: obs_tempo
    image: grafana/tempo:2.3.0
    ports:
      - "3201:3200"
      - "4319:4317"
      - "4320:4318"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml

  prometheus:
    container_name: obs_prometheus
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml

  grafana:
    container_name: obs_grafana
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - tempo
      - prometheus
      - loki

volumes:
  account_pgdata: {}
  transaction_pgdata: {}
  notification_pgdata: {}
  kafka_data: {}
