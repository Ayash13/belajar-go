global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: 'development'
    app: 'bank-api'

scrape_configs:
  - job_name: 'bank-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'core-banking'
